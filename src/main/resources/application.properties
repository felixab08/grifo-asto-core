spring.application.name=grifo-asto-core

# Puerto del servidor (Railway usa la variable PORT para el servidor HTTP)
server.port=${PORT:8080}

# JPA
spring.jpa.database=postgresql
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Datos a PostgreSQL (Evitamos usar ${PORT} que colisiona con el puerto HTTP de Railway)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${HOST:localhost}:${DB_PORT:5432}/${DATABASE:grifodb}}
spring.datasource.username=${DB_USER:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PASSWORD:admin123}}

# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=7200000
# 7200000 ms = 120 minutes